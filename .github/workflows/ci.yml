name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 3s --health-retries 20
    env:
      VOIZY_TEST_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.3"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy packages
      - run: uv run pytest -q
      - name: Dashboard API types are in sync with the backend
        run: |
          uv run python scripts/export_openapi.py /tmp/openapi.json
          diff -u apps/dashboard/openapi.json /tmp/openapi.json

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API types are up to date
        run: |
          pnpm gen:api
          git diff --exit-code -- src/api/schema.d.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build


  image:
    runs-on: ubuntu-latest
    needs: [test, dashboard]
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target api -t voizy-api:ci .
      - run: docker build --target agent -t voizy-agent:ci .
      - run: docker build -t voizy-dashboard:ci apps/dashboard
      - name: Smoke test the images
        run: |
          docker run --rm voizy-api:ci voizy-admin --help
          # Import every module: catches a runtime dependency that is only declared for development.
          IMPORT_ALL='import importlib, pkgutil, sys; p = importlib.import_module(sys.argv[1]); [importlib.import_module(m.name) for m in pkgutil.walk_packages(p.__path__, p.__name__ + ".") if "testing" not in m.name and "devtools" not in m.name]'
          docker run --rm voizy-api:ci python -c "$IMPORT_ALL" voizy_api
          docker run --rm voizy-api:ci python -c "$IMPORT_ALL" voizy_core
          docker run --rm voizy-agent:ci python -c "$IMPORT_ALL" voizy_agent
          docker run --rm voizy-dashboard:ci nginx -t
