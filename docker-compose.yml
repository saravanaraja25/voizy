# The whole stack: Postgres, one-shot migrations, API, voice worker and dashboard.
#   cp .env.example .env   # set the passwords and VOIZY_SECRET_KEYS
#   docker compose up --build
# Then open http://localhost:8080 and follow the first-run screen (the setup token is in the API log:
#   docker compose logs api | grep "setup token").
# Only the dashboard's port is published; it proxies /v1 to the API, so the browser sees one origin.
name: voizy-oss  # distinct project name so volumes never collide with other stacks

x-app-env: &app-env
  VOIZY_DATABASE_URL: postgresql://voizy_api:${VOIZY_APP_DB_PASSWORD}@postgres:5432/voizy
  # Encrypts stored integration keys and tool credentials. Generate: voizy-admin generate-secret-key
  VOIZY_SECRET_KEYS: ${VOIZY_SECRET_KEYS:?set in .env (voizy-admin generate-secret-key)}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: voizy_admin
      POSTGRES_PASSWORD: ${VOIZY_ADMIN_DB_PASSWORD:?set in .env}
      POSTGRES_DB: voizy
      VOIZY_APP_DB_PASSWORD: ${VOIZY_APP_DB_PASSWORD:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voizy_admin -d voizy"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${VOIZY_PG_PORT:-5433}:5432"

  migrate:
    build: { context: ., target: api }
    image: voizy-api:local
    command: ["voizy-admin", "migrate"]
    environment:
      VOIZY_ADMIN_DATABASE_URL: postgresql://voizy_admin:${VOIZY_ADMIN_DB_PASSWORD}@postgres:5432/voizy
      VOIZY_APP_LOGIN_ROLE: voizy_api
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: { context: ., target: api }
    image: voizy-api:local
    environment:
      <<: *app-env
      # The origins the dashboard is served from (checked on every write, alongside the CSRF token).
      VOIZY_CORS_ORIGINS: ${VOIZY_PUBLIC_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      # Plain http on localhost needs this off. Turn it ON (the default elsewhere) behind TLS.
      VOIZY_COOKIE_SECURE: ${VOIZY_COOKIE_SECURE:-0}
      VOIZY_SETUP_TOKEN: ${VOIZY_SETUP_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # No published port: only the dashboard's proxy can reach the API.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  agent:
    build: { context: ., target: agent }
    image: voizy-agent:local
    environment:
      <<: *app-env
      # Optional. With these unset the worker waits for LiveKit to be connected in the dashboard.
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  dashboard:
    build: ./apps/dashboard
    image: voizy-dashboard:local
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${VOIZY_PORT:-8080}:8080"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

volumes:
  pgdata:
