[project]
name = "voizy-agent"
version = "0.1.0"
description = "Voizy voice runtime: a generic LiveKit agent driven by AgentConfig"
requires-python = ">=3.12"
dependencies = [
  "voizy-core",
  "livekit-agents[silero,turn-detector]>=1.2",
  "livekit-plugins-openai==1.8.11",
  "livekit-plugins-deepgram==1.8.11",
  "livekit-plugins-cartesia==1.8.11",
  "livekit-plugins-google==1.8.11",
]

[tool.uv.sources]
voizy-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voizy_agent"]
