[project]
name = "voizy-api"
version = "0.1.0"
description = "Voizy control-plane REST API"
requires-python = ">=3.12"
dependencies = ["voizy-core", "fastapi>=0.115", "uvicorn[standard]>=0.32"]

[tool.uv.sources]
voizy-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voizy_api"]
