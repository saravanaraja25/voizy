[project]
name = "voizy-core"
version = "0.1.0"
description = "Voizy domain models, permissions and persistence"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "cryptography>=43", "psycopg[binary,pool]>=3.2"]

[project.scripts]
voizy-admin = "voizy_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voizy_core"]
