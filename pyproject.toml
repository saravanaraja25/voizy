[project]
name = "voizy"
version = "0.1.0"
description = "Open-source configurable AI voice agent platform"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
voizy-core = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13", "voizy-core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["packages"]
asyncio_default_fixture_loop_scope = "function"
